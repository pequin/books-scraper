[project]
name = "books-scraper"
version = "0.1.0"
description = "Polite Python scraper for books.toscrape.com with retries and CSV, JSON, and Excel export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]
